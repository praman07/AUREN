    <meta name="description" content="Ultra-premium, minimalistic AI knowledge assistant and research workspace with document intelligence, source grounding, and multi-source connectors." />
    <meta property="og:title" content="AUREN - Knowledge Workspace" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('auren_theme');
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBFBFB] text-[#191919] dark:bg-[#0D0E10] dark:text-[#E8E8E8] antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
